# Live-image seed only. The 0200-spicy.hook.chroot rewrites this file during
# the live build so Autologin is generated under the /etc/spicy/live-image
# guard. Installed systems must not keep Autologin; spicy-purge-live-autologin
# removes this file when the live-image marker is absent.
[Theme]
Current=spicy

[Autologin]
User=spicy
Session=plasma.desktop
Relogin=false
